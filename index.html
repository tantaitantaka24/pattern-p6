<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>เฉลยแบบรูป ป.6</title>
<meta name="description" content="เฉลยแบบละเอียด เห็นภาพ กดไล่ทีละขั้น แบบฝึกหัด 5.3–5.4 บทที่ 5 แบบรูป คณิตศาสตร์ ป.6 เล่ม 1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=Mitr:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf7ee; --card:#fff; --ink:#2b2b2b; --muted:#6b6b6b; --line:#eadfc8;
  --accent:#f4b400; --accent-d:#c98e00; --brand:#7a3fb0; --red:#e0262f;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Sarabun,system-ui,sans-serif;font-size:18px;line-height:1.6}
header{background:#fff;border-bottom:3px solid var(--accent);padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-family:Mitr,Sarabun,sans-serif;font-weight:500;font-size:22px;margin:0;color:var(--brand)}
header .sub{color:var(--muted);font-size:15px}
.layout{display:grid;grid-template-columns:270px 1fr;gap:0;min-height:calc(100vh - 60px)}
nav{background:#fff;border-right:1px solid var(--line);padding:10px 0;overflow:auto;max-height:calc(100vh - 60px);position:sticky;top:0}
nav h4{margin:14px 16px 4px;font-family:Mitr,sans-serif;font-weight:500;font-size:15px;color:var(--accent-d)}
nav h5{margin:8px 16px 2px;font-size:14px;color:var(--muted);font-weight:600}
nav button{display:block;width:100%;text-align:left;background:none;border:0;padding:5px 16px 5px 26px;font:inherit;font-size:16px;color:var(--ink);cursor:pointer;border-left:4px solid transparent}
nav button:hover{background:#fff6dc}
nav button.on{background:#fff1c2;border-left-color:var(--accent);font-weight:700}
nav .tag3d{font-size:11px;background:#7a3fb0;color:#fff;border-radius:6px;padding:0 5px;margin-left:4px;vertical-align:2px}
#psel{display:none;width:100%;font:inherit;font-size:16px;padding:8px;border-radius:10px;border:1px solid var(--line);background:#fff}
main{padding:18px 26px 40px;max-width:1100px;width:100%}
.phead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.badge{background:var(--accent);color:#3b2a00;font-family:Mitr,sans-serif;border-radius:999px;padding:2px 14px;font-size:16px}
.page{color:var(--muted);font-size:15px}
#pq{width:100%;font-size:20px;margin:6px 0 10px}
.chip{display:inline-block;width:.9em;height:.9em;border:1px solid #333;vertical-align:-1px;margin:0 2px}
.chip.dot{border-radius:50%}
.tabs{display:flex;gap:6px;margin:6px 0 12px;border-bottom:2px solid var(--line)}
.tabs button{font:inherit;font-family:Mitr,sans-serif;font-size:17px;padding:6px 16px;border:0;background:none;cursor:pointer;color:var(--muted);border-bottom:4px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.stepbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.stepbar button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:#fff;font:inherit;font-weight:700;cursor:pointer;color:var(--muted)}
.stepbar button.done{background:#fff1c2;border-color:var(--accent);color:#6b4d00}
.stepbar button.on{background:var(--accent);border-color:var(--accent-d);color:#3b2a00}
h3#stitle{font-family:Mitr,sans-serif;font-weight:500;margin:6px 0 8px;font-size:21px}
.stage{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden}
.stage svg.fig{width:100%;height:auto;display:block}
svg text{font-family:Sarabun,sans-serif}
svg .lab{font-size:19px;fill:#333;text-anchor:middle}
svg .sub{text-anchor:middle;font-weight:700}
.explain{background:#fffaf0;border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:12px;padding:12px 16px;margin-top:12px;font-size:19px}
.explain p{margin:.2em 0 .5em}
.tip{color:#7a5b00}
.ans{display:inline-block;margin-top:8px;background:#e8f7ee;border:2px solid #18a058;color:#0c6b3a;border-radius:10px;padding:4px 14px;font-weight:700;font-size:21px}
.formula{font-size:24px;font-weight:700;text-align:center}
.navbtn{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:10px}
.navbtn button,.tryctl button{font:inherit;font-family:Mitr,sans-serif;font-size:18px;padding:8px 22px;border-radius:12px;border:0;cursor:pointer;background:var(--brand);color:#fff}
.navbtn button:disabled{background:#cfc6d8;cursor:default}
.navbtn #prev{background:#fff;color:var(--brand);border:2px solid var(--brand)}
.navbtn #prev:disabled{color:#bbb;border-color:#ddd}
#scount{color:var(--muted);font-size:15px}
.tryctl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.tryctl button{width:46px;padding:6px 0;font-size:24px;line-height:1}
.tryctl input{flex:1;min-width:160px;accent-color:var(--brand);height:30px}
.tryctl label{font-family:Mitr,sans-serif;font-size:20px;min-width:120px}
.tryctl b{color:var(--brand);font-size:26px}
table.tb{border-collapse:collapse;font-size:17px;background:#fff;margin:0 auto}
.tb th,.tb td{border:1.5px solid #e2a3a6;padding:4px 12px;text-align:center}
.tb th{background:#fde8e8;color:#9b1c22;font-weight:700}
.tb tr.hl td{background:#fff1c2;font-weight:700}
.tbwrap{max-width:100%;overflow:auto}
.three{position:relative;width:100%;height:400px;border-radius:12px;background:radial-gradient(#ffffff,#f1ebdd);overflow:hidden;touch-action:none}
.three canvas{display:block}
.three .tload{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.three .replay{position:absolute;right:10px;bottom:10px;font:inherit;font-size:15px;border:0;border-radius:10px;padding:4px 12px;background:#7a3fb0;color:#fff;cursor:pointer}
.three .hint{position:absolute;left:12px;bottom:10px;font-size:14px;color:var(--muted)}
.three .lbl3{position:absolute;left:12px;top:8px;font-size:16px;font-weight:700;color:#555}
.cards{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.card{background:#fffaf0;border:2px solid var(--line);border-radius:14px;padding:10px 18px;text-align:center;min-width:160px}
.card b{display:block;font-size:26px;color:var(--brand)}
footer{color:var(--muted);font-size:14px;padding:16px 26px}
@media (max-width:820px){
  body{font-size:17px}
  .layout{display:block}
  nav{display:none}
  #psel{display:block;margin-bottom:10px}
  main{padding:12px 16px 30px}
  .three{height:320px}
  .explain{font-size:17px}
  .formula{font-size:20px}
  header h1{font-size:19px}
}
</style>
<script type="importmap">

</script>

<body>
<header>
  <h1>เฉลยแบบรูป ป.6 เล่ม 1 · บทที่ 5</h1>
  <span class="sub">แบบฝึกหัด 5.3–5.4 (หน้า 134–147) · กดไล่ทีละขั้น · ลองรูปที่ n เอง</span>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main>
    <select id="psel" aria-label="เลือกข้อ"></select>
    <div class="phead"><span class="badge" id="badge"></span><span class="page" id="page"></span></div>
    <div id="pq"></div>
    <div class="tabs"><button data-tab="steps" class="on">เฉลยทีละขั้น</button><button data-tab="try" id="trytab">ลองรูปที่ n</button></div>
    <section id="steps">
      <div class="stepbar" id="dots"></div>
      <h3 id="stitle"></h3>
      <div class="stage" id="stage"></div>
      <div class="explain" id="explain"></div>
      <div class="navbtn"><button id="prev">◀ ย้อนกลับ</button><span id="scount"></span><button id="next">ถัดไป ▶</button></div>
    </section>
    <section id="try" hidden>
      <div class="tryctl"><button id="minus" aria-label="ลด">−</button><label><span id="tlabel">รูปที่</span> <b id="nval"></b></label><input type="range" id="nrange"><button id="plus" aria-label="เพิ่ม">+</button></div>
      <div class="stage" id="tstage"></div>
      <div class="explain" id="tinfo"></div>
    </section>
  </main>
</div>
<footer>โจทย์จากแบบฝึกหัดรายวิชาพื้นฐานคณิตศาสตร์ ป.6 เล่ม 1 ของ สสวท. วาดรูปใหม่และอธิบายวิธีคิดตามคู่มือครู · ใช้ลูกศร ← → บนคีย์บอร์ดเพื่อไปขั้นถัดไปได้</footer>

<script type="module">
/* ============ พื้นฐาน ============ */
const $=s=>document.querySelector(s);
const fmt=n=>Number(n).toLocaleString('en-US');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const C={red:'#e0262f',blue:'#1d5fd1',green:'#0e9a4e',purple:'#8e3fb8',pink:'#d6338a',orange:'#e8730c',ink:'#2b2b2b',teal:'#0a8f9a',gray:'#777',gold:'#b8860b'};
const F={yellow:'#fcc419',sky:'#4dc0f0',green:'#12a150',pink:'#f06cb8',purple:'#7b44a8',orange:'#f59a4c',lblue:'#86c8ec',brown:'#7b5134',blue:'#1c7fd0',tgreen:'#4cba6a',bpurple:'#cc80c8',hblue:'#97a6dc',horange:'#f58e45',cube:'#8fd16a',caramel:'#d9a24e'};
const chip=(c,dot)=>`<i class="chip${dot?' dot':''}" style="background:${c}"></i>`;
const H=segs=>segs.map(([t,c])=>`<span style="color:${c||C.ink}">${esc(t)}</span>`).join('');
const TS=segs=>segs.map(([t,c])=>`<tspan fill="${c||C.ink}">${esc(t)}</tspan>`).join('');
const segLen=segs=>segs.reduce((a,[t])=>a+String(t).length,0);
function shade(hex,f){const n=parseInt(hex.slice(1),16);const ch=[n>>16,n>>8&255,n&255].map(v=>Math.round(f>0?v+(255-v)*f:v*(1+f)));return '#'+ch.map(v=>v.toString(16).padStart(2,'0')).join('')}

/* ============ รูปทรงพื้นฐาน (หน่วยช่อง, แกน y ชี้ลง) ============ */
const sqU=(x,y,fill,o={})=>({t:'sq',x,y:-y-1,fill,u:1,...o});        // แกน y ชี้ขึ้น
const outU=(cells,c,sw)=>({t:'out',cells:cells.map(([x,y])=>[x,-y-1]),c,sw});
const stick=(x1,y1,x2,y2,c)=>({t:'stick',x1,y1,x2,y2,c,u:1});
const txt=(x,y,v,c,s=.5,a='middle')=>({t:'txt',x,y,v,c,s,a});
function outPath(cells){const S=new Set(cells.map(([x,y])=>x+','+y)),h=(x,y)=>S.has(x+','+y);let d='';
  for(const [x,y] of cells){
    if(!h(x,y-1))d+=`M${x} ${y}H${x+1}`; if(!h(x,y+1))d+=`M${x} ${y+1}H${x+1}`;
    if(!h(x-1,y))d+=`M${x} ${y}V${y+1}`; if(!h(x+1,y))d+=`M${x+1} ${y}V${y+1}`;}
  return d}
function hexPts(cx,cy,r,flat){const p=[];for(let i=0;i<6;i++){const a=Math.PI/180*(flat?60*i:60*i-90);p.push([cx+r*Math.cos(a),cy+r*Math.sin(a)])}return p}
function bounds(prims){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;const A=(x,y)=>{if(x<x0)x0=x;if(y<y0)y0=y;if(x>x1)x1=x;if(y>y1)y1=y};
  for(const p of prims){switch(p.t){
    case 'sq':A(p.x,p.y);A(p.x+1,p.y+1);break;
    case 'out':for(const [x,y] of p.cells){A(x,y);A(x+1,y+1)}break;
    case 'stick':case 'ln':A(p.x1,p.y1);A(p.x2,p.y2);break;
    case 'dot':case 'circ':case 'ring':{const r=p.r||.13;A(p.x-r,p.y-r);A(p.x+r,p.y+r);break}
    case 'hex':hexPts(p.cx,p.cy,p.r,p.flat).forEach(([x,y])=>A(x,y));break;
    case 'poly':p.pts.forEach(([x,y])=>A(x,y));break;
    case 'ell':A(p.cx-p.rx,p.cy-p.ry);A(p.cx+p.rx,p.cy+p.ry);break;
    case 'txt':{const w=String(p.v).length*p.s*.32;const xa=p.a==='start'?p.x:p.x-w;A(xa,p.y-p.s/2);A(xa+2*w,p.y+p.s/2);break}
  }}
  return {x0,y0,w:Math.max(x1-x0,.01),h:Math.max(y1-y0,.01)}}
const NS='vector-effect="non-scaling-stroke"';
function dp(p){switch(p.t){
  case 'sq':return `<rect x="${p.x}" y="${p.y}" width="1" height="1" fill="${p.fill}" stroke="${p.st||'#2b2b2b'}" stroke-width="${p.sw||1}" ${NS}${p.op!=null?` opacity="${p.op}"`:''}/>`;
  case 'out':return `<path d="${outPath(p.cells)}" fill="none" stroke="${p.c}" stroke-width="${p.sw||3.5}" stroke-linecap="round" ${NS}/>`;
  case 'stick':{const k=.07,dx=p.x2-p.x1,dy=p.y2-p.y1,a=[p.x1+dx*k,p.y1+dy*k],b=[p.x2-dx*k,p.y2-dy*k];
    return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${p.c||'#d9a35a'}" stroke-width="${p.c?6:5}" stroke-linecap="round" ${NS}/><circle cx="${b[0]}" cy="${b[1]}" r="0.07" fill="#b8332b"/>`}
  case 'ln':return `<line x1="${p.x1}" y1="${p.y1}" x2="${p.x2}" y2="${p.y2}" stroke="${p.c}" stroke-width="${p.w||2}" ${NS}${p.dash?' stroke-dasharray="5 4"':''}/>`;
  case 'dot':return `<circle cx="${p.x}" cy="${p.y}" r="${p.r||.13}" fill="${p.c||'#12a150'}"/>`;
  case 'circ':return `<circle cx="${p.x}" cy="${p.y}" r="${p.r}" fill="${p.fill}" stroke="#222" stroke-width="1" ${NS}/>`;
  case 'ring':return `<circle cx="${p.x}" cy="${p.y}" r="${p.r}" fill="none" stroke="${p.c}" stroke-width="3.5" ${NS}/>`;
  case 'hex':return `<polygon points="${hexPts(p.cx,p.cy,p.r,p.flat).map(q=>q.join(',')).join(' ')}" fill="${p.fill}" stroke="${p.st||'#2b2b2b'}" stroke-width="${p.sw||1}" stroke-linejoin="round" ${NS}/>`;
  case 'poly':return `<polygon points="${p.pts.map(q=>q.join(',')).join(' ')}" fill="${p.fill}" stroke="${p.st||'#2d2d2d'}" stroke-width="${p.sw||1}" stroke-linejoin="round" ${NS}${p.op!=null?` opacity="${p.op}"`:''}/>`;
  case 'ell':return `<ellipse cx="${p.cx}" cy="${p.cy}" rx="${p.rx}" ry="${p.ry}" fill="none" stroke="${p.c}" stroke-width="2.5" ${NS}/>`;
  case 'txt':return `<text x="${p.x}" y="${p.y}" font-size="${p.s}" fill="${p.c||C.ink}" text-anchor="${p.a||'middle'}" dominant-baseline="central" font-weight="700">${esc(p.v)}</text>`;
}return ''}
const order={sq:0,poly:0,hex:0,circ:0,ln:0,stick:1,dot:2,out:3,ring:3,ell:3,txt:4};
const drawAll=prims=>[...prims].sort((a,b)=>(order[a.t]||0)-(order[b.t]||0)).map(dp).join('');

/* แถวรูป: items=[{m,label,sub,sub2}] วาดเป็น SVG เดียว */
const narrow=()=>innerWidth<700;
function row(items,o={}){
  const maxH=o.maxH||220,W=o.W||900,gap=o.gap||34,fs=19;
  const bs=items.map(it=>bounds(it.m));
  if(items.length>2&&narrow()&&!o.u){ // จอมือถือ: จัดเป็นแถวละ 2 รูป ใช้มาตราส่วนเดียวกัน
    const W2=480,pairs=[];for(let i=0;i<items.length;i+=2)pairs.push(i);
    const u=Math.min(o.maxU||44,maxH/Math.max(...bs.map(b=>b.h)),...pairs.map(i=>(W2-gap)/(bs[i].w+(bs[i+1]?bs[i+1].w:0))));
    return pairs.map(i=>row(items.slice(i,i+2),{...o,u,W:W2})).join('')}
  const sumW=bs.reduce((a,b)=>a+b.w,0),maxBh=Math.max(...bs.map(b=>b.h));
  const u=o.u||Math.min(o.maxU||44,maxH/maxBh,(W-gap*(items.length-1))/sumW);
  const slots=items.map((it,i)=>Math.max(bs[i].w*u,o.minSlot||100,it.sub?segLen(it.sub)*fs*.52:0,it.sub2?segLen(it.sub2)*fs*.52:0,it.label?String(it.label).length*fs*.5:0));
  const figH=maxBh*u;let x=0,out='';
  const lines=(items.some(i=>i.label)?1:0)+(items.some(i=>i.sub)?1:0)+(items.some(i=>i.sub2)?1:0);
  items.forEach((it,i)=>{const b=bs[i],w=b.w*u,h=b.h*u,ox=x+(slots[i]-w)/2,oy=o.top?0:figH-h;
    out+=`<g transform="translate(${ox.toFixed(2)},${oy.toFixed(2)}) scale(${u.toFixed(4)}) translate(${-b.x0},${-b.y0})">${drawAll(it.m)}</g>`;
    const cx=x+slots[i]/2;let ty=figH+26;
    if(it.label){out+=`<text x="${cx}" y="${ty}" class="lab">${esc(it.label)}</text>`;ty+=28}
    if(it.sub){out+=`<text x="${cx}" y="${ty}" class="sub" font-size="${fs}">${TS(it.sub)}</text>`;ty+=28}
    if(it.sub2){out+=`<text x="${cx}" y="${ty}" class="sub" font-size="${fs}">${TS(it.sub2)}</text>`}
    x+=slots[i]+gap});
  const total=x-gap,Ht=figH+lines*28+(lines?6:0);
  return `<svg class="fig" viewBox="-12 -12 ${total+24} ${Ht+24}" style="max-width:${Math.round(total+24)}px">${out}</svg>`}
function tbl(head,rows,o={}){return `<div class="tbwrap"><table class="tb">${head?`<tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>`:''}${rows.map((r,i)=>`<tr class="${(o.hl===i||(o.hlSet&&o.hlSet.includes(i)))?'hl':''}">${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</table></div>`}

/* ลูกบาศก์แบบภาพ 3 มิติบนกระดาษ (isometric) */
function iso(cubes,gap=0){const cs=Math.cos(Math.PI/6),P=(x,y,z)=>[(x-y)*cs,(x+y)*.5-z];
  const arr=[...cubes].sort((a,b)=>(a.x+a.y+a.z)-(b.x+b.y+b.z)||a.z-b.z),out=[];
  for(const c of arr){const {x,y}=c,z=c.z*(1+gap);
    out.push({t:'poly',pts:[P(x,y+1,z),P(x+1,y+1,z),P(x+1,y+1,z+1),P(x,y+1,z+1)],fill:shade(c.c,-.28)},
             {t:'poly',pts:[P(x+1,y,z),P(x+1,y+1,z),P(x+1,y+1,z+1),P(x+1,y,z+1)],fill:shade(c.c,-.1)},
             {t:'poly',pts:[P(x,y,z+1),P(x+1,y,z+1),P(x+1,y+1,z+1),P(x,y+1,z+1)],fill:shade(c.c,.22),u:1})}
  return out}

/* ============ Three.js (3 มิติ หมุนได้) ============ */
let threeP=null;const loadThree=()=>threeP||(threeP=Promise.all([import('three'),import('three/addons/controls/OrbitControls.js')]));
const specs=new Map(),live=[];let sid=0;
function three(spec){const id='t3_'+(sid++);specs.set(id,spec);
  return `<div class="three" id="${id}"><div class="tload">กำลังโหลดภาพ 3 มิติ…</div>${spec.label?`<div class="lbl3">${spec.label}</div>`:''}<span class="hint">ลากเพื่อหมุน · หมุนล้อเพื่อซูม</span><button class="replay">▶ เล่นอีกครั้ง</button></div>`}
function disposeAll(){while(live.length)live.pop()();specs.clear()}
async function mountAll(root){const els=[...root.querySelectorAll('.three')];if(!els.length)return;
  let mods;try{mods=await loadThree()}catch(e){els.forEach(el=>{const l=el.querySelector('.tload');if(l)l.textContent='ภาพ 3 มิติต้องต่ออินเทอร์เน็ต (โหลด Three.js ไม่ได้)'});return}
  for(const el of els){const spec=specs.get(el.id);if(spec&&el.isConnected)mount3(el,spec,mods[0],mods[1].OrbitControls)}}
function mount3(el,spec,T,Orbit){
  const W=el.clientWidth||600,Hh=el.clientHeight||400;
  const R=new T.WebGLRenderer({antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(W,Hh);
  el.querySelector('.tload')?.remove();el.prepend(R.domElement);
  const scene=new T.Scene();scene.add(new T.HemisphereLight(0xffffff,0x9aa4b0,1.7));
  const dl=new T.DirectionalLight(0xffffff,1.6);dl.position.set(6,12,8);scene.add(dl);
  const torus=spec.kind==='torus',dz=spec.dz||1,ex=spec.explode||0;
  const items=spec.items;let mn=[1e9,1e9,1e9],mx=[-1e9,-1e9,-1e9];
  for(const it of items){const p=[it.x,it.z*dz*(1+ex),it.y];for(let i=0;i<3;i++){mn[i]=Math.min(mn[i],p[i]);mx[i]=Math.max(mx[i],p[i])}}
  const off=torus?0:.5,cen=[(mn[0]+mx[0])/2+off,(mn[1]+mx[1]+(torus?dz:1))/2,(mn[2]+mx[2])/2+off];
  const layers=new Map();for(const it of items){if(!layers.has(it.z))layers.set(it.z,[]);layers.get(it.z).push(it)}
  const keys=[...layers.keys()].sort((a,b)=>a-b);
  const geos=[],mats=new Map();const mat=c=>{if(!mats.has(c))mats.set(c,new T.MeshStandardMaterial({color:c,roughness:.6}));return mats.get(c)};
  const box=new T.BoxGeometry(.97,.97,.97),tor=new T.TorusGeometry(.3,.15,12,24),lineM=new T.LineBasicMaterial({color:0x33331f});geos.push(box,tor);
  const root=new T.Group();scene.add(root);
  if(spec.plate){const pw=mx[0]-mn[0]+2,pd=mx[2]-mn[2]+2,pg=new T.BoxGeometry(pw,.2,pd);geos.push(pg);const pm=new T.Mesh(pg,new T.MeshStandardMaterial({color:0xc9c9cf}));pm.position.set((mn[0]+mx[0])/2-cen[0],-.1-cen[1],(mn[2]+mx[2])/2-cen[2]);root.add(pm)}
  const groups=keys.map(z=>{const g=new T.Group(),its=layers.get(z);
    if(torus){its.forEach(it=>{const m=new T.Mesh(tor,mat(it.c));m.rotation.x=Math.PI/2;m.position.set(it.x-cen[0],.15,it.y-cen[2]);g.add(m)})}
    else{const byC=new Map();its.forEach(it=>{if(!byC.has(it.c))byC.set(it.c,[]);byC.get(it.c).push(it)});
      const M=new T.Matrix4();
      for(const [c,list] of byC){const im=new T.InstancedMesh(box,mat(c),list.length);list.forEach((it,j)=>{M.makeTranslation(it.x+.5-cen[0],.5,it.y+.5-cen[2]);im.setMatrixAt(j,M)});g.add(im)}
      const pos=[];its.forEach(it=>{const x0=it.x-cen[0],x1=x0+1,z0=it.y-cen[2],z1=z0+1;const E=[[x0,0,z0,x1,0,z0],[x1,0,z0,x1,0,z1],[x1,0,z1,x0,0,z1],[x0,0,z1,x0,0,z0],[x0,1,z0,x1,1,z0],[x1,1,z0,x1,1,z1],[x1,1,z1,x0,1,z1],[x0,1,z1,x0,1,z0],[x0,0,z0,x0,1,z0],[x1,0,z0,x1,1,z0],[x1,0,z1,x1,1,z1],[x0,0,z1,x0,1,z1]];E.forEach(e=>pos.push(...e))});
      const lg=new T.BufferGeometry();lg.setAttribute('position',new T.Float32BufferAttribute(pos,3));geos.push(lg);g.add(new T.LineSegments(lg,lineM))}
    g.userData.y=z*dz*(1+ex)-cen[1];root.add(g);return g});
  const rad=Math.max(1.5,Math.hypot(mx[0]-mn[0]+1,mx[1]-mn[1]+1,mx[2]-mn[2]+1)/2);
  const cam=new T.PerspectiveCamera(35,W/Hh,.1,500);const dir=new T.Vector3(1.15,.95,1.45).normalize();
  cam.position.copy(dir.multiplyScalar(rad*3.1));
  const ctl=new Orbit(cam,R.domElement);ctl.enableDamping=true;ctl.target.set(0,0,0);ctl.update();
  const step=spec.anim===false?0:(spec.step||Math.min(.5,4/keys.length));let start=performance.now(),raf;
  const ease=t=>1-Math.pow(1-t,3);
  function frame(now){const t=(now-start)/1000;
    groups.forEach((g,i)=>{const p=step?Math.min(1,Math.max(0,(t-i*step)/.45)):1;g.visible=p>0;g.position.y=g.userData.y+(1-ease(p))*3});
    ctl.update();R.render(scene,cam);raf=requestAnimationFrame(frame)}
  raf=requestAnimationFrame(frame);
  el.querySelector('.replay').onclick=()=>{start=performance.now()};
  const ro=new ResizeObserver(()=>{const w=el.clientWidth,h=el.clientHeight;if(!w)return;R.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()});ro.observe(el);
  live.push(()=>{cancelAnimationFrame(raf);ro.disconnect();ctl.dispose();geos.forEach(g=>g.dispose());mats.forEach(m=>m.dispose());lineM.dispose();R.dispose();R.domElement.remove()})}

/* ============ ตัวสร้างข้อแบบรูป (6 ขั้นมาตรฐาน) ============ */
const P=[];
function pattern(c){
  const unit=c.unit||'รูป',ask=c.ask;
  const cnt=c.cnt||(n=>[[`${fmt(c.count(n))} ${unit}`,C.ink]]);
  const eq=c.eq||(n=>[...c.segs(n),[` = ${fmt(c.count(n))}`,C.ink]]);
  const figs=(hl,sub)=>row([1,2,3,4].map(n=>({m:c.fig(n,hl),label:`รูปที่ ${n}`,sub:sub?sub(n):null})),c.rowOpt);
  const cs=[1,2,3,4].map(c.count),d=[cs[1]-cs[0],cs[2]-cs[1],cs[3]-cs[2]],same=d.every(v=>v===d[0]);
  const diff=c.diff||(`รูปที่ 1 ถึงรูปที่ 4 มี ${cs.map(fmt).join(', ')} ${unit} ตามลำดับ<br>`+(same?`จำนวนเพิ่มขึ้นทีละ <b>${d[0]}</b> ${unit} เท่ากันทุกครั้ง`:`จำนวนที่เพิ่มขึ้นคือ ${d.join(', ')} ซึ่ง<b>ไม่เท่ากัน</b> จึงต้องดูให้ละเอียดว่าส่วนไหนเพิ่มขึ้น`));
  const askTbl=k=>c.table?tbl(['',...c.table.map(n=>`รูปที่ ${n}`)],[[c.tlabel,...c.table.map((n,i)=>i<k?`<b style="color:${C.red}">${fmt(c.count(n))}</b>`:'…')]]):'';
  const steps=[
    {t:'อ่านโจทย์ ดูรูปที่ 1–4',stage:()=>figs(false)+askTbl(0),x:`<p>${c.q}</p><p class="tip">💡 ดูว่ารูปถัดไปต่างจากรูปก่อนหน้าอย่างไร</p>`},
    {t:'นับจำนวนในแต่ละรูป',stage:()=>figs(false,cnt)+askTbl(4),x:diff},
    {t:'แยกส่วนให้เห็นแบบรูป',stage:()=>figs(true),x:c.split},
    {t:'เขียนความสัมพันธ์',stage:()=>figs(true,c.segs)+(c.tbl?tbl(c.tbl.head,[1,2,3,4].map(c.tbl.row)):''),x:c.rel},
    {t:'ตรวจสอบกับรูปที่ 5',stage:()=>row([{m:c.fig(5,true),label:'รูปที่ 5',sub:eq(5)}],{maxH:250}),
      x:`ถ้าความสัมพันธ์ถูกต้อง รูปที่ 5 ต้องมี ${H(eq(5))} ${unit}<br>ลองนับในรูปจริงก็ได้เท่านี้ ✓ แสดงว่าความสัมพันธ์ใช้ได้`},
    {t:`หาคำตอบ: รูปที่ ${ask}`,stage:()=>row([{m:c.fig(ask,true),label:`รูปที่ ${ask}`}],{maxH:c.askH||320,maxU:56})+`<div class="formula">รูปที่ ${ask}: ${H(eq(ask))}</div>`+askTbl(c.table?c.table.length:0),
      x:c.final?c.final(ask):`ดังนั้น รูปที่ ${ask} มี ${c.chip||''} ทั้งหมด ${H(eq(ask))} ${unit}<br><span class="ans">ตอบ ${fmt(c.count(ask))} ${unit}</span>`}];
  P.push({...c,steps,cfg:c,try:{label:'รูปที่',min:1,max:c.tryMax||12,init:5,
    render:n=>({stage:row([{m:c.fig(n,true),label:`รูปที่ ${n}`,sub:eq(n)}],{maxH:330,maxU:56}),
      info:`รูปที่ ${n} มี ${H(eq(n))} ${unit}`+(c.tryNote?c.tryNote(n):(n>1&&!c.multi?`<br>เพิ่มจากรูปที่ ${n-1} อยู่ ${fmt(c.count(n)-c.count(n-1))} ${unit}`:''))})}})}
const ink=t=>[t,C.ink];

pattern({id:'1.1',sec:'5.3',grp:'ข้อ 1',name:'1) ตัว L สีเหลือง',page:134,ask:13,tryMax:15,chip:chip(F.yellow),

pattern({id:'1.8',sec:'5.3',grp:'ข้อ 1',name:'8) กากบาทสีน้ำเงิน',page:135,ask:8,tryMax:10,chip:chip(F.blue),

pattern({id:'2.1',sec:'5.3',grp:'ข้อ 2',name:'1) หกเหลี่ยม',page:136,ask:8,tryMax:12,unit:'ก้าน',table:[1,2,3,4,8],tlabel:'จำนวนไม้ขีด (ก้าน)',

pattern({id:'2.3',sec:'5.3',grp:'ข้อ 2',name:'3) สามเหลี่ยมเรียงแถว',page:136,ask:8,tryMax:15,unit:'ก้าน',table:[1,2,3,4,8],tlabel:'จำนวนไม้ขีด (ก้าน)',

/* ---------- ข้อ 3 จุด ---------- */
function triDots(n,hl){const A=[],h=h3,pos=(r,i)=>[i-r/2,r*h];
  for(let r=0;r<n;r++)for(let i=0;i<=r;i++){const [x,y]=pos(r,i);
    if(i<r){const [x2,y2]=pos(r,i+1);A.push({t:'ln',x1:x,y1:y,x2,y2,c:'#4cc3d9'})}
    if(r<n-1){const [a,b]=pos(r+1,i),[c2,d]=pos(r+1,i+1);A.push({t:'ln',x1:x,y1:y,x2:a,y2:b,c:'#4cc3d9'},{t:'ln',x1:x,y1:y,x2:c2,y2:d,c:'#4cc3d9'})}
    A.push({t:'dot',x,y,u:1})}
  if(hl)for(let r=0;r<n;r++)A.push(txt(r/2+.55,r*h,r+1,C.red,.48,'start'));return A}
const sumList=n=>Array.from({length:n},(_,i)=>i+1).join(' + ');
pattern({id:'3.1',sec:'5.3',grp:'ข้อ 3',name:'1) จุดสามเหลี่ยม',page:137,ask:9,tryMax:12,unit:'จุด',table:[1,2,3,4,9],tlabel:'จำนวนจุด',

  final:n=>`ดังนั้น รูปที่ 9 มีจุด 1 + 2 + 3 + 4 + 5 + 6 + 7 + 8 + 9 = <b>45</b> จุด<br><span class="ans">ตอบ 1, 3, 6, 10 และ 45 จุด</span>`});

pattern({id:'3.2',sec:'5.3',grp:'ข้อ 3',name:'2) จุดสี่เหลี่ยม',page:137,ask:9,tryMax:12,unit:'จุด',table:[1,2,3,4,9],tlabel:'จำนวนจุด',

  final:n=>`ดังนั้น รูปที่ 9 มีจุด 10 × 10 = <b>100</b> จุด<br><span class="ans">ตอบ 4, 9, 16, 25 และ 100 จุด</span>`});

function honey(n,hl){const s3=Math.sqrt(3),pts=new Map(),E=new Set(),A=[],key=(x,y)=>`${Math.round(x*1e3)},${Math.round(y*1e3)}`;
  for(let r=0;r<n;r++)for(let i=0;i<=r;i++){const cx=(i-r/2)*s3,cy=r*1.5,vs=hexPts(cx,cy,1,false);
    vs.forEach(v=>pts.set(key(...v),v));for(let j=0;j<6;j++){const a=key(...vs[j]),b=key(...vs[(j+1)%6]);const k=a<b?a+'|'+b:b+'|'+a;if(!E.has(k)){E.add(k);const v2=vs[(j+1)%6];A.push({t:'ln',x1:vs[j][0],y1:vs[j][1],x2:v2[0],y2:v2[1],c:'#4cc3d9'})}}}
  const P2=[...pts.values()];P2.forEach(([x,y])=>A.push({t:'dot',x,y,u:1,r:.15}));
  if(hl){const lv=[...new Set(P2.map(p=>Math.round(p[1]*1e3)))].sort((a,b)=>a-b);
    for(let j=0;j<lv.length;j+=2){const g=P2.filter(p=>{const y=Math.round(p[1]*1e3);return y===lv[j]||y===lv[j+1]});
      const xs=g.map(p=>p[0]),x0=Math.min(...xs),x1=Math.max(...xs),cy=(lv[j]+lv[j+1])/2000;
      A.push({t:'ell',cx:(x0+x1)/2,cy,rx:(x1-x0)/2+.45,ry:.55,c:C.red},txt(x1+.75,cy,g.length,C.red,.6,'start'))}}
  return A}
const honeySegs=n=>{const g=[];for(let j=0;j<n;j++)g.push(2*j+3);g.push(2*n+1);return g};
pattern({id:'3.3',sec:'5.3',grp:'ข้อ 3',name:'3) จุดรังผึ้ง',page:137,ask:9,tryMax:10,unit:'จุด',table:[1,2,3,4,9],tlabel:'จำนวนจุด',askH:360,

/* 4.6 ขนมลูกเต๋า */
const pyr=n=>{const a=[];for(let k=1;k<=n;k++)for(let x=-(k-1);x<=k-1;x++)for(let y=-(k-1);y<=k-1;y++)if(Math.abs(x)+Math.abs(y)<=k-1)a.push({x,y,z:n-k,c:F.caramel});return a};
const layerTop=k=>{const A=[];for(let x=-(k-1);x<=k-1;x++)for(let y=-(k-1);y<=k-1;y++){const inD=Math.abs(x)+Math.abs(y)<=k-1,g=(((x+y+k-1)%2)+2)%2===0;
  A.push({t:'sq',x,y,fill:inD?(g?'#3cb371':'#f08a3c'):'#fff',st:inD?'#2b2b2b':'#bbb',u:inD?1:0})}return A};
const lsum=k=>k*k+(k-1)*(k-1);

function floor(N,o={}){const A=[];for(let x=0;x<N;x++)for(let y=0;y<N;y++){const k=Math.max(x,y)+1,yel=k%2===1;
  const fade=(o.emph==='y'&&!yel)||(o.emph==='g'&&yel);A.push(sqU(x,y,yel?'#ffe94a':'#2eaf5d',{op:fade?.18:1}))}
  if(o.labels!==false)for(let k=1;k<=N;k++){const fade=(o.emph==='y'&&k%2===0)||(o.emph==='g'&&k%2===1);if(!fade)A.push(txt(k-.5,-(k-.5),k,k%2?'#7a5b00':'#fff',.5))}
  return A}
const odd=k=>2*k-1,rngA=(a,b,s=1)=>{const r=[];for(let i=a;i<=b;i+=s)r.push(i);return r};

const PIL=['#c0392b','#2c3e7a','#1e7f4f','#d4a017','#7a2f8c'];
function pillows(n,labels){const A=[],h=h3;let c=0;
  for(let k=1;k<=n;k++){const yt=(k-1)*h,yb=k*h,x0=-k/2;
    for(let j=0;j<k;j++){const pts=[[x0+j,yb],[x0+j+1,yb],[x0+j+.5,yt]];A.push({t:'poly',pts,fill:PIL[(c++)%5],st:'#4a2f12',sw:1.5,u:1});A.push({t:'poly',pts:[[x0+j+.3,yb-.1],[x0+j+.7,yb-.1],[x0+j+.5,yt+.35]],fill:'#fff',op:.55,st:'none'})}
    for(let j=0;j<k-1;j++){const pts=[[x0+j+.5,yt],[x0+j+1.5,yt],[x0+j+1,yb]];A.push({t:'poly',pts,fill:PIL[(c++)%5],st:'#4a2f12',sw:1.5,u:1});A.push({t:'poly',pts:[[x0+j+.8,yt+.1],[x0+j+1.2,yt+.1],[x0+j+1,yb-.35]],fill:'#fff',op:.55,st:'none'})}
    if(labels)A.push(txt(k/2+.35,(k-.5)*h,`${odd(k)} ใบ`,C.red,.42,'start'))}return A}

// ข้อ 3 เงินเดือน
function salaryChart(N){const W=900,base=150,top=40,bw=Math.min(70,(W-60)/N-14),bh=N>1?Math.min(22,170/(N-1)):22,gy=top+170+base;let s='';
  for(let i=1;i<=N;i++){const x=40+(i-1)*(bw+14),r=i-1,yb=gy-base;
    s+=`<rect x="${x}" y="${yb}" width="${bw}" height="${base}" fill="#9fc0e0" stroke="#5b7fa6"/>`;
    if(bw>44)s+=`<text x="${x+bw/2}" y="${yb+base/2}" text-anchor="middle" font-size="14" fill="#2c4a6b" transform="rotate(-90 ${x+bw/2} ${yb+base/2})">9,000</text>`;
    for(let j=0;j<r;j++)s+=`<rect x="${x}" y="${yb-(j+1)*bh}" width="${bw}" height="${bh}" fill="#f4a62a" stroke="#b86e00"/>`;
    s+=`<text x="${x+bw/2}" y="${yb-r*bh-8}" text-anchor="middle" font-size="${bw>50?16:12}" font-weight="700" fill="${i===N?C.red:C.ink}">${fmt(9000+250*r)}</text>`;
    s+=`<text x="${x+bw/2}" y="${gy+22}" text-anchor="middle" font-size="16">ปีที่ ${i}</text>`}
  const Wt=40+N*(bw+14)+20;
  return `<svg class="fig" viewBox="0 0 ${Math.max(Wt,420)} ${gy+60}" style="max-width:${Math.max(Wt,420)}px"><line x1="30" y1="${gy}" x2="${Wt}" y2="${gy}" stroke="#333"/>${s}<rect x="40" y="${gy+34}" width="16" height="12" fill="#9fc0e0" stroke="#5b7fa6"/><text x="62" y="${gy+45}" font-size="14">เงินเดือนปีแรก 9,000</text><rect x="210" y="${gy+34}" width="16" height="12" fill="#f4a62a" stroke="#b86e00"/><text x="232" y="${gy+45}" font-size="14">ขึ้นครั้งละ 250</text></svg>`}
const salRows=N=>rngA(1,N).map(n=>[n,n===1?'9,000':`9,000 + (${n-1} × 250)`,fmt(9000+250*(n-1))]);

function bikeChart(N){const W=900,ph=260,top=40,max=1700,sc=ph/max,bw=Math.min(54,(W-80)/Math.max(N,6)-10),gy=top+ph;let s='';
  const gyL=gy-GOAL*sc;
  for(let w=1;w<=N;w++){const x=60+(w-1)*(bw+10),ho=own(w)*sc,hm=mom(w)*sc,ok=tot(w)>=GOAL;
    s+=`<rect x="${x}" y="${gy-ho}" width="${bw}" height="${ho}" fill="#5b9bf0" stroke="#2f6bc0"/><rect x="${x}" y="${gy-ho-hm}" width="${bw}" height="${hm}" fill="#f28cc0" stroke="#c0508a"/>`;
    s+=`<text x="${x+bw/2}" y="${gy-ho-hm-7}" text-anchor="middle" font-size="${bw>40?14:11}" font-weight="700" fill="${ok?C.green:C.ink}">${fmt(tot(w))}${ok?' ✓':''}</text>`;
    s+=`<text x="${x+bw/2}" y="${gy+20}" text-anchor="middle" font-size="14">${w}</text>`}
  const Wt=60+Math.max(N,6)*(bw+10)+20;
  return `<svg class="fig" viewBox="0 0 ${Wt} ${gy+64}" style="max-width:${Wt}px"><line x1="50" y1="${gy}" x2="${Wt}" y2="${gy}" stroke="#333"/>${s}
  <line x1="50" y1="${gyL}" x2="${Wt}" y2="${gyL}" stroke="${C.red}" stroke-width="2" stroke-dasharray="8 5"/><text x="54" y="${gyL-8}" font-size="15" fill="${C.red}" font-weight="700">ราคาจักรยาน 1,490 บาท</text>
  <text x="${Wt/2}" y="${gy+40}" text-anchor="middle" font-size="14">สัปดาห์ที่</text>
  <rect x="60" y="${gy+48}" width="14" height="12" fill="#5b9bf0"/><text x="80" y="${gy+59}" font-size="14">เงินของพิม (สะสม)</text><rect x="230" y="${gy+48}" width="14" height="12" fill="#f28cc0"/><text x="250" y="${gy+59}" font-size="14">เงินของแม่ (สะสม)</text></svg>`}
const bikeRows=(a,b)=>rngA(a,b).map(w=>[w,35,`${w} × 15 = ${15*w}`,w===1?`35 + (1 × 15) = 50`:`${fmt(tot(w-1))} + 35 + (${w} × 15) = ${fmt(tot(w))}`]);
const bikeHead=['สัปดาห์ที่','เงินของพิม','เงินของแม่','รวม (บาท)'];
P.push({id:'5.4-5',sec:'5.4',grp:'',name:'5) เก็บเงินซื้อจักรยาน',page:147,
  q:`พิมต้องการซื้อจักรยานราคา 1,490 บาท จึงเก็บเงินทุกสัปดาห์ สัปดาห์ละ 35 บาท และแม่จะสมทบให้ สัปดาห์แรก 15 บาท สัปดาห์ที่ 2 ให้ 30 บาท สัปดาห์ที่ 3 ให้ 45 บาท สัปดาห์ที่ 4 ให้ 60 บาท เป็นเช่นนี้ไปเรื่อย ๆ พิมต้องเก็บเงินอย่างน้อยกี่สัปดาห์ จึงจะซื้อจักรยานคันนี้ได้`,
  steps:[
    {t:'อ่านโจทย์',stage:()=>`<div class="cards"><div class="card">พิมเก็บสัปดาห์ละ<b>35</b>บาท</div><div class="card">แม่ให้สัปดาห์ที่ k<b>k × 15</b>บาท</div><div class="card">ราคาจักรยาน<b>1,490</b>บาท</div></div>`,
      x:`เงินของแม่: สัปดาห์ที่ 1 ให้ 15 = 1 × 15, สัปดาห์ที่ 2 ให้ 30 = 2 × 15, สัปดาห์ที่ 3 ให้ 45 = 3 × 15<br><span class="tip">💡 รวมเงินสะสมทีละสัปดาห์ จนถึงหรือเกิน 1,490 บาท</span>`},
    {t:'สัปดาห์ที่ 1 ถึง 3',stage:()=>bikeChart(3)+tbl(bikeHead,bikeRows(1,3)),
      x:`สัปดาห์ที่ 1: 35 + (1 × 15) = 50 บาท<br>สัปดาห์ที่ 2: เงินเดิม 50 + 35 + (2 × 15) = 115 บาท<br>สัปดาห์ที่ 3: 115 + 35 + (3 × 15) = 195 บาท`},
    {t:'สัปดาห์ที่ 4 ถึง 8',stage:()=>bikeChart(8)+tbl(bikeHead,bikeRows(4,8)),
      x:`ทำแบบเดิม: เงินรวมสัปดาห์ก่อน + 35 + (ลำดับที่สัปดาห์ × 15)<br>สัปดาห์ที่ 8 มีเงินรวม 820 บาท ยังไม่ถึง 1,490 บาท`},
    {t:'สัปดาห์ที่ 9 ถึง 11',stage:()=>bikeChart(11)+tbl(bikeHead,bikeRows(9,11)),
      x:`สัปดาห์ที่ 11 มีเงินรวม <b>1,375</b> บาท<br>ยังขาดอีก 1,490 − 1,375 = 115 บาท จึงยังซื้อไม่ได้`},
    {t:'หาคำตอบ: สัปดาห์ที่ 12',stage:()=>bikeChart(12)+tbl(bikeHead,bikeRows(12,12),{hl:0}),
      x:`สัปดาห์ที่ 12: 1,375 + 35 + (12 × 15) = <b>1,590</b> บาท ซึ่งมากกว่า 1,490 บาท ✓<br>ดังนั้น พิมต้องเก็บเงินอย่างน้อย 12 สัปดาห์ จึงจะซื้อจักรยานคันนี้ได้<br><span class="ans">ตอบ 12 สัปดาห์</span>`}],
  try:{label:'สัปดาห์ที่',min:1,max:15,init:12,render:n=>({stage:bikeChart(n),info:`สัปดาห์ที่ ${n}: เงินของพิมสะสม 35 × ${n} = ${fmt(own(n))} บาท · เงินของแม่สะสม ${fmt(mom(n))} บาท<br>รวม <b>${fmt(tot(n))}</b> บาท ${tot(n)>=GOAL?`<b style="color:${C.green}">✓ ซื้อจักรยานได้แล้ว</b>`:`ยังขาดอีก ${fmt(GOAL-tot(n))} บาท`}`})}});

/* ============ หน้าจอ ============ */
let cur=0,step=0,tab='steps',tn=5,tTimer=null;
function label(p){return p.sec==='5.3'?`แบบฝึกหัด 5.3 ${p.grp} ${p.name.split(' ')[0]}`:`แบบฝึกหัด 5.4 ข้อ ${p.name.split(')')[0]}`}
function buildNav(){let h='',last='',lastG='';P.forEach((p,i)=>{if(p.sec!==last){h+=`<h4>แบบฝึกหัด ${p.sec}</h4>`;last=p.sec;lastG=''}
    if(p.grp&&p.grp!==lastG){h+=`<h5>${p.grp}</h5>`;lastG=p.grp}
    h+=`<button data-i="${i}">${p.name}${p.d3?'<span class="tag3d">3D</span>':''}</button>`});
  $('#nav').innerHTML=h;$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.i)};
  $('#psel').innerHTML=P.map((p,i)=>`<option value="${i}">${p.sec} ${p.grp} ${p.name}</option>`).join('');$('#psel').onchange=e=>go(+e.target.value)}
function go(i,s=0){cur=i;step=s;const p=P[i];tn=p.try.init;history.replaceState(null,'','#'+p.id);
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));$('#psel').value=i;
  $('#badge').textContent=label(p);$('#page').textContent=`หน้า ${p.page}`;$('#pq').innerHTML=p.q;
  $('#trytab').textContent=`ลอง${p.try.label.replace('ที่','')}ที่ n`.replace('จำนวนชั้นที่ n','ลองเปลี่ยนจำนวนชั้น').replace('ลองลอง','ลอง');
  const r=$('#nrange');r.min=p.try.min;r.max=p.try.max;r.value=tn;$('#tlabel').textContent=p.try.label;
  setTab(tab)}
function setTab(t){tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  $('#steps').hidden=t!=='steps';$('#try').hidden=t!=='try';t==='steps'?renderStep():renderTry()}
function renderStep(){disposeAll();const p=P[cur],st=p.steps[step];
  $('#dots').innerHTML=p.steps.map((s,i)=>`<button class="${i===step?'on':i<step?'done':''}" data-s="${i}" title="${s.t}">${i+1}</button>`).join('');
  $('#stitle').textContent=`ขั้นที่ ${step+1} · ${st.t}`;$('#stage').innerHTML=st.stage();$('#explain').innerHTML=st.x;
  $('#prev').disabled=step===0&&cur===0;$('#prev').textContent=step===0?'◀ ข้อก่อนหน้า':'◀ ย้อนกลับ';
  const last=step===p.steps.length-1;$('#next').textContent=last?(cur<P.length-1?'ข้อถัดไป ▶':'จบแล้ว ✓'):'ถัดไป ▶';$('#next').disabled=last&&cur===P.length-1;
  $('#scount').textContent=`${step+1} / ${p.steps.length}`;mountAll($('#stage'))}
function renderTry(){disposeAll();const p=P[cur],r=p.try.render(tn);$('#nval').textContent=tn;$('#nrange').value=tn;
  $('#tstage').innerHTML=r.stage;$('#tinfo').innerHTML=r.info;mountAll($('#tstage'))}
function setN(v){const t=P[cur].try;tn=Math.max(t.min,Math.min(t.max,v));$('#nval').textContent=tn;$('#nrange').value=tn;clearTimeout(tTimer);tTimer=setTimeout(renderTry,120)}
function next(){const p=P[cur];if(step<p.steps.length-1){step++;renderStep()}else if(cur<P.length-1)go(cur+1)}
function prev(){if(step>0){step--;renderStep()}else if(cur>0)go(cur-1,P[cur-1].steps.length-1)}
$('#next').onclick=next;$('#prev').onclick=prev;
$('#dots').onclick=e=>{const b=e.target.closest('button');if(b){step=+b.dataset.s;renderStep()}};
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('button');if(b)setTab(b.dataset.tab)};
$('#nrange').oninput=e=>setN(+e.target.value);$('#minus').onclick=()=>setN(tn-1);$('#plus').onclick=()=>setN(tn+1);
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  if(e.key==='ArrowRight'){tab==='steps'?next():setN(tn+1);e.preventDefault()}
  if(e.key==='ArrowLeft'){tab==='steps'?prev():setN(tn-1);e.preventDefault()}});
let wasNarrow=narrow();addEventListener('resize',()=>{if(narrow()!==wasNarrow){wasNarrow=narrow();tab==='steps'?renderStep():renderTry()}});
buildNav();
const hi=P.findIndex(p=>'#'+p.id===decodeURIComponent(location.hash));go(hi>=0?hi:0);

/* ตรวจว่าจำนวนในรูปที่วาด ตรงกับสูตร (เปิด console แล้วพิมพ์ __check()) */
window.__check=()=>{const bad=[];P.filter(p=>p.cfg).forEach(p=>{for(let n=1;n<=10;n++){const got=p.cfg.fig(n,false).filter(q=>q.u).length;if(got!==p.cfg.count(n))bad.push(`${p.id} n=${n}: วาด ${got} สูตร ${p.cfg.count(n)}`)}});return bad.length?bad:'ok'};
</script>
